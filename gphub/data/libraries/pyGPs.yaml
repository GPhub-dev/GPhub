PackageID: pyGPs
Library:
  - Name: pyGPs
    URL: https://github.com/marionmari/pyGPs
    Reference:
      - Author: Neumann et al. (2015)
        URL: https://jmlr.org/papers/v16/neumann15a.html
Language:
  - Python
License:
  - Name: FreeBSD
    URL: https://github.com/marionmari/pyGPs/blob/master/COPYRIGHT.txt
Repository:
  - Name: marionmari/pyGPs
    URL: https://github.com/marionmari/pyGPs
Version:
  - Name: v1.3.5
    URL: https://github.com/marionmari/pyGPs/releases/tag/v1.3.5
Installation:
  - PyPI
Developer:
  - Tag: red
    Name: Washington University
    URL: https://wustl.edu
  - Tag: teal
    Name: Fraunhofer IAIS
    URL: https://www.iais.fraunhofer.de/en.html
  - Tag: green
    Name: TU Dortmund
    URL: https://www.tu-dortmund.de/en/
  - Tag: yellow
    Name: Sproutling
    URL: https://www.crunchbase.com/organization/sproutling
  - Tag: default
    Name: pyGPs contributors
    URL: https://github.com/marionmari/pyGPs/graphs/contributors
Docs:
  - Name: docs
    URL: https://www.cse.wustl.edu/~m.neumann/pyGPs_doc/
  - Name: examples
    URL: https://www.cse.wustl.edu/~m.neumann/pyGPs_doc/Examples.html
Support:
  - Name: null
    URL: null
Framework:
  - NumPy
  - SciPy
GPU: false
Models:
  - Types:
      - Tag: blue
        Name: Gaussian Process Regression (GPR)
      - Tag: orange
        Name: Gaussian Process Classification (GPC)
      - Tag: uiBlue
        Name: GPR with Fully Independent Training Conditional (FITC)
      - Tag: uiBlue
        Name: GPC with Fully Independent Training Conditional (FITC)
      - Tag: default
        Name: Multi-class Gaussian Process Classification (one-vs-one)
    URL: https://www.cse.wustl.edu/~m.neumann/pyGPs_doc/Examples.html
Complexity:
  - null
Trend:
  - Types:
      - Tag: blue
        Name: Zero
      - Tag: default
        Name: One
      - Tag: orange
        Name: Constant
      - Tag: green
        Name: Linear
      - Tag: red
        Name: Sum
      - Tag: default
        Name: Product
      - Tag: default
        Name: Scaled
      - Tag: default
        Name: Power
      - Tag: default
        Name: Custom
    URL: https://www.cse.wustl.edu/~m.neumann/pyGPs_doc/Theory.html
LengthScale:
  - Isotropic
  - Anisotropic
Correlation:
  - Types:
      - Tag: orange
        Name: Constant
      - Tag: green
        Name: Linear
      - Tag: yellow
        Name: Matern
      - Tag: green
        Name: Periodic
      - Tag: teal
        Name: Polynomial
      - Tag: teal
        Name: Piecewise Polynomial
      - Tag: blue
        Name: Squared Exponential
      - Tag: red
        Name: Rational Quadratic
      - Tag: default
        Name: Gabor
      - Tag: default
        Name: Spectral Mixture
      - Tag: default
        Name: White noise
      - Tag: default
        Name: Graph kernels
      - Tag: default
        Name: Precomputed
      - Tag: default
        Name: Custom
    URL: https://www.cse.wustl.edu/~m.neumann/pyGPs_doc/Theory.html
Mixture: true
MixtureModels:
  - Types:
      - Tag: red
        Name: Sum
      - Tag: green
        Name: Product
      - Tag: teal
        Name: Scale
    URL: https://www.cse.wustl.edu/~m.neumann/pyGPs_doc/Kernels.html
Likelihood:
  - Types:
      - Tag: blue
        Name: Gaussian
      - Tag: default
        Name: Probit
      - Tag: purple
        Name: Laplace
    URL: https://www.cse.wustl.edu/~m.neumann/pyGPs_doc/Default.html
    Nugget:
      - Tag: default
        Name: Custom
      - Tag: yellow
        Name: Inferable
      - Tag: blue
        Name: "default value: 0.1"
    Noise:
      - Tag: yellow
        Name: Inferable
EstimationMethods:
  - Types:
      - Tag: blue
        Name: Maximum Likelihood Estimation (MLE)
      - Tag: default
        Name: Exact inference
      - Tag: default
        Name: Expectation Propagation (EP)
      - Tag: purple
        Name: Laplace Approximation (LA)
      - Tag: uiBlue
        Name: Fully Independent Training Conditional (FITC)
    URL: https://www.cse.wustl.edu/~m.neumann/pyGPs_doc/Default.html
OptimizationMethods:
  - Types:
      - Tag: default
        Name: Minimize
      - Tag: orange
        Name: Conjugate Gradient (CG)
      - Tag: yellow
        Name: BFGS
      - Tag: default
        Name: Scaled Conjugate Gradient (SCG)
    URL: https://www.cse.wustl.edu/~m.neumann/pyGPs_doc/Opts.html
Resampling: true
Metrics:
  - RMSE
  - NLPD
