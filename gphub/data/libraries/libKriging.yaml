PackageID: libKriging
Library:
  - Name: libKriging
    URL: https://libkriging.readthedocs.io/en/latest/index.html
    Reference:
      - Author: Richet et al. (2023)
        URL: https://zenodo.org/records/10333106
Language:
  - C++
  - Python
  - R
  - Matlab
  - Octave
License:
  - Name: Apache-2.0
    URL: https://github.com/libKriging/libKriging/blob/master/LICENSE
Repository:
  - Name: libKriging/libKriging
    URL: https://github.com/libKriging/libKriging
Version:
  - Name: v1.2.2
    URL: https://github.com/libKriging/libKriging/releases/tag/v1.2.2
Installation:
  - PyPI
  - CRAN
Developer:
  - Tag: default
    Name: libKriging contributors
    URL: https://github.com/libKriging/libKriging/graphs/contributors
Docs:
  - Name: docs
    URL: https://libkriging.readthedocs.io/en/latest/usage.html
  - Name: r docs
    URL: https://cran.r-project.org/web/packages/rlibkriging/rlibkriging.pdf
  - Name: API
    URL: https://libkriging.readthedocs.io/en/latest/api.html
  - Name: colab notebooks
    URL: https://libkriging.readthedocs.io/en/latest/usage.html#basic-demo
Support:
  - Name: GitHub discussions
    URL: https://github.com/libKriging/libKriging/discussions
Framework:
  - null
GPU: false
Models:
  - Types:
      - Tag: blue
        Name: Gaussian Process Regression (GPR)
      - Tag: default
        Name: Ordinary Kriging (OK)
      - Tag: default
        Name: Universal Kriging (UK)
      - Tag: default
        Name: Input-warped Kriging (WarpKriging)
      - Tag: default
        Name: Deep Kernel Learning (DKL)
      - Tag: default
        Name: Nested Kriging (NK / PoE / gPoE / BCM / rBCM)
    URL: https://libkriging.readthedocs.io/en/latest/index.html
Complexity:
  - O(N^3)
Trend:
  - Types:
      - Tag: orange
        Name: Constant
      - Tag: green
        Name: Linear
      - Tag: default
        Name: Interactive
      - Tag: red
        Name: Quadratic
    URL: https://libkriging.readthedocs.io/en/latest/functions/Kriging.html
LengthScale:
  - Anisotropic
Correlation:
  - Types:
      - Tag: blue
        Name: Gaussian
      - Tag: teal
        Name: Exponential
      - Tag: yellow
        Name: Matern32
      - Tag: yellow
        Name: Matern52
    URL: https://libkriging.readthedocs.io/en/latest/math/kernel.html
Mixture: false
MixtureModels:
  - Types:
      - Tag: null
        Name: null
    URL: null
Likelihood:
  - Types:
      - Tag: blue
        Name: Gaussian
    URL: https://libkriging.readthedocs.io/en/latest/noise/index.html
    Nugget:
      - Tag: yellow
        Name: Inferable
    Noise:
      - Tag: default
        Name: Custom
EstimationMethods:
  - Types:
      - Tag: blue
        Name: Maximum Likelihood Estimation (MLE)
      - Tag: green
        Name: Leave-One-Out Cross-Validation (LOOCV)
      - Tag: default
        Name: Log-Marginal Posterior (LMP)
      - Tag: default
        Name: Vecchia approximated log-likelihood (LLVecchia)
      - Tag: default
        Name: Nystrom approximated log-likelihood (LLNystrom)
    URL: https://libkriging.readthedocs.io/en/latest/functions/fit.Kriging.html
OptimizationMethods:
  - Types:
      - Tag: yellow
        Name: BFGS
      - Tag: default
        Name: Multi-start BFGS
      - Tag: default
        Name: Newton
    URL: https://libkriging.readthedocs.io/en/latest/functions/fit.Kriging.html
Resampling: true
Metrics:
  - LOOCV
