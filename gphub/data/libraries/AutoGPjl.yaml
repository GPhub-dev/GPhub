Complexity:
  - null
Trend:
  - Types:
      - Tag: blue
        Name: Zero
    URL: https://probsys.github.io/AutoGP.jl/stable/api.html
LengthScale:
  - Isotropic
Correlation:
  - Types:
      - Tag: default
        Name: White noise
      - Tag: orange
        Name: Constant
      - Tag: green
        Name: Linear
      - Tag: blue
        Name: Squared Exponential
      - Tag: default
        Name: Gamma Exponential
      - Tag: green
        Name: Periodic
