PackageID: UQTK
Library:
  - Name: UQTk
    URL: https://www.sandia.gov/uqtoolkit/
    Reference:
      - Author: Debusschere et al. (2017)
        URL: http://www.springer.com/us/book/9783319123844
Language:
  - C++
License:
  - Name: BSD-3-Clause
    URL: https://github.com/sandialabs/UQTk/blob/master/LICENSE
Repository:
  - Name: sandialabs/UQTk
    URL: https://github.com/sandialabs/UQTk
Version:
  - Name: v3.1.5
    URL: https://github.com/sandialabs/UQTk/releases/tag/v3.1.5
Installation:
  - null
Developer:
  - Tag: blue
    Name: Sandia National Laboratories
    URL: https://www.sandia.gov/
  - Tag: default
    Name: UQTk contributors
    URL: https://github.com/sandialabs/UQTk/graphs/contributors
Docs:
  - Name: docs
    URL: https://www.sandia.gov/uqtoolkit/manual/
  - Name: user manuals
    URL: https://github.com/sandialabs/UQTk/blob/master/docs/UQTk_manual.pdf
  - Name: API
    URL: https://sandialabs.github.io/UQTk/
  - Name: examples
    URL: https://github.com/sandialabs/UQTk/tree/master/examples
Support:
  - Name: GitHub discussions
    URL: https://github.com/sandialabs/UQTk/discussions
Framework:
  - null
GPU: false
Models:
  - Types:
      - Tag: blue
        Name: Gaussian Process Regression (GPR)
    URL: https://github.com/sandialabs/UQTk/blob/master/docs/UQTk_manual.pdf
Complexity:
  - null
Trend:
  - Types:
      - Tag: teal
        Name: Polynomial
    URL: https://github.com/sandialabs/UQTk/blob/master/docs/UQTk_manual.pdf
LengthScale:
  - Anisotropic
Correlation:
  - Types:
      - Tag: blue
        Name: Squared Exponential
    URL: https://sandialabs.github.io/UQTk/html/classGproc.html
Mixture: false
MixtureModels:
  - Types:
      - Tag: null
        Name: null
    URL: null
Likelihood:
  - Types:
      - Tag: blue
        Name: Gaussian
    URL: https://github.com/sandialabs/UQTk/blob/master/docs/UQTk_manual.pdf
    Nugget:
      - Tag: blue
        Name: "default value: 1e-6"
      - Tag: default
        Name: Custom
    Noise:
      - Tag: null
        Name: null
EstimationMethods:
  - Types:
      - Tag: default
        Name: Exact inference
      - Tag: default
        Name: Maximum A Posteriori (MAP)
    URL: https://github.com/sandialabs/UQTk/blob/master/docs/UQTk_manual.pdf
OptimizationMethods:
  - Types:
      - Tag: yellow
        Name: L-BFGS
    URL: https://github.com/sandialabs/UQTk/blob/master/cpp/lib/gproc/gproc.cpp
Resampling: false
Metrics:
  - null
