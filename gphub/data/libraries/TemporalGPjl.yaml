    Reference:
      - Author: Tebbutt et al. (2021)
        URL: https://proceedings.mlr.press/v161/tebbutt21a.html
Language:
  - Julia
License:
  - Name: MIT
    URL: https://github.com/JuliaGaussianProcesses/TemporalGPs.jl/blob/master/LICENSE
Repository:
  - Name: JuliaGaussianProcesses/TemporalGPs.jl
    URL: https://github.com/JuliaGaussianProcesses/TemporalGPs.jl
Version:
  - Name: v0.7.3
    URL: https://github.com/JuliaGaussianProcesses/TemporalGPs.jl/releases/tag/v0.7.3
Installation:
  - Pkg.jl
Developer:
  - Tag: yellow
    Name: University of Cambridge
    URL: https://www.cam.ac.uk/
  - Tag: default
    Name: Aalto University
    URL: https://www.aalto.fi/en
  - Tag: default
    Name: TemporalGPs.jl contributors
    URL: https://github.com/JuliaGaussianProcesses/TemporalGPs.jl/graphs/contributors
Docs:
  - Name: examples
    URL: https://github.com/JuliaGaussianProcesses/TemporalGPs.jl/tree/master/examples
  - Name: talk
    URL: https://www.youtube.com/watch?v=dysmEpX1QoE
Support:
  - Name: null
    URL: null
Framework:
  - Distributions.jl
GPU: false
Models:
  - Types:
      - Tag: blue
        Name: Gaussian Process Regression (GPR)
      - Tag: default
        Name: Markov (State Space) Gaussian Process
      - Tag: default
        Name: Spatio-Temporal Gaussian Process
      - Tag: default
        Name: Sparse Markov Gaussian Process
      - Tag: orange
        Name: Gaussian Process Classification (GPC)
    URL: https://github.com/JuliaGaussianProcesses/TemporalGPs.jl/blob/master/README.md
Complexity:
  - O(N)
Trend:
  - Types:
      - Tag: blue
        Name: Zero
      - Tag: orange
        Name: Constant
    URL: https://github.com/JuliaGaussianProcesses/TemporalGPs.jl/blob/master/examples/exact_time_learning.jl
LengthScale:
  - Isotropic
Correlation:
  - Types:
      - Tag: yellow
        Name: Matern12
      - Tag: yellow
        Name: Matern32
      - Tag: yellow
        Name: Matern52
      - Tag: green
        Name: Cosine
      - Tag: default
        Name: Approximate Periodic
      - Tag: orange
        Name: Constant
      - Tag: blue
        Name: Squared Exponential
    URL: https://github.com/JuliaGaussianProcesses/TemporalGPs.jl/blob/master/src/gp/lti_sde.jl
Mixture: true
MixtureModels:
  - Types:
      - Tag: red
        Name: Sum
      - Tag: green
        Name: Product
      - Tag: teal
        Name: Scale
      - Tag: default
        Name: Separable
    URL: https://github.com/JuliaGaussianProcesses/TemporalGPs.jl/blob/master/src/gp/lti_sde.jl
Likelihood:
  - Types:
      - Tag: blue
        Name: Gaussian
      - Tag: orange
        Name: Bernoulli
    URL: https://github.com/JuliaGaussianProcesses/TemporalGPs.jl/blob/master/README.md
    Nugget:
      - Tag: default
        Name: Custom
    Noise:
      - Tag: yellow
        Name: Inferable
      - Tag: default
        Name: Custom
EstimationMethods:
  - Types:
      - Tag: blue
        Name: Maximum Likelihood Estimation (MLE)
      - Tag: red
        Name: Evidence Lower Bound (ELBO)
      - Tag: uiBlue
        Name: Deterministic Training Conditional (DTC)
    URL: https://github.com/JuliaGaussianProcesses/TemporalGPs.jl/blob/master/examples/exact_time_learning.jl
OptimizationMethods:
  - Types:
      - Tag: purple
        Name: Optim.jl optimizer
      - Tag: yellow
        Name: BFGS
    URL: https://github.com/JuliaGaussianProcesses/TemporalGPs.jl/blob/master/examples/exact_time_learning.jl
Resampling: false
Metrics:
  - null
