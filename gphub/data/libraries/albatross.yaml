PackageID: albatross
Library:
  - Name: albatross
    URL: https://swiftnav-albatross.readthedocs.io/en/latest/
    Reference:
      - Author: Swift Navigation (2018)
        URL: https://github.com/swift-nav/albatross
Language:
  - C++
License:
  - Name: MIT
    URL: https://github.com/swift-nav/albatross/blob/master/LICENSE
Repository:
  - Name: swift-nav/albatross
    URL: https://github.com/swift-nav/albatross
Version:
  - Name: master (2026-09-22)
    URL: https://github.com/swift-nav/albatross/commits/master
Installation:
  - null
Developer:
  - Tag: orange
    Name: Swift Navigation
    URL: https://www.swiftnav.com
  - Tag: default
    Name: albatross contributors
    URL: https://github.com/swift-nav/albatross/graphs/contributors
Docs:
  - Name: docs
    URL: https://swiftnav-albatross.readthedocs.io/en/latest/
Support:
  - Name: null
    URL: null
Framework:
  - null
GPU: false
Models:
  - Types:
      - Tag: blue
        Name: Gaussian Process Regression (GPR)
      - Tag: green
        Name: Sparse Gaussian Process Regression (SGPR)
    URL: https://swiftnav-albatross.readthedocs.io/en/latest/
Complexity:
  - O(N^3)
  - O(NM^2)
Trend:
  - Types:
      - Tag: blue
        Name: Zero
      - Tag: green
        Name: Linear
      - Tag: default
        Name: Custom
    URL: https://github.com/swift-nav/albatross/blob/master/include/albatross/src/covariance_functions/mean_function.hpp
LengthScale:
  - Isotropic
Correlation:
  - Types:
      - Tag: blue
        Name: Squared Exponential
      - Tag: teal
        Name: Exponential
      - Tag: yellow
        Name: Matern32
      - Tag: yellow
        Name: Matern52
      - Tag: orange
        Name: Constant
      - Tag: teal
        Name: Polynomial
      - Tag: default
        Name: White noise
      - Tag: default
        Name: Custom
    URL: https://github.com/swift-nav/albatross/tree/master/include/albatross/src/covariance_functions
Mixture: true
MixtureModels:
  - Types:
      - Tag: red
        Name: Sum
      - Tag: green
        Name: Product
      - Tag: teal
        Name: Scale
    URL: https://swiftnav-albatross.readthedocs.io/en/latest/gp-albatross.html
Likelihood:
  - Types:
      - Tag: blue
        Name: Gaussian
    URL: https://swiftnav-albatross.readthedocs.io/en/latest/gp-background.html
    Nugget:
      - Tag: default
        Name: Custom
    Noise:
      - Tag: yellow
        Name: Inferable
      - Tag: default
        Name: Custom
EstimationMethods:
  - Types:
      - Tag: blue
        Name: Maximum Likelihood Estimation (MLE)
      - Tag: green
        Name: Leave-One-Out Cross-Validation (LOOCV)
      - Tag: default
        Name: Markov Chain Monte Carlo (MCMC)
      - Tag: uiBlue
        Name: Fully Independent Training Conditional (FITC)
      - Tag: uiBlue
        Name: Partially Independent Training Conditional (PITC)
    URL: https://swiftnav-albatross.readthedocs.io/en/latest/tuning.html
OptimizationMethods:
  - Types:
      - Tag: default
        Name: NLopt
    URL: https://swiftnav-albatross.readthedocs.io/en/latest/tuning.html
Resampling: true
Metrics:
  - RMSE
  - LOOCV
  - NLPD
