PackageID: GPflux
Library:
  - Name: GPflux
    URL: https://secondmind-labs.github.io/GPflux/#
    Reference:
      - Author: Dutordoir et al. (2021)
        URL: https://arxiv.org/abs/2104.05674
Language:
  - Python
License:
  - Name: Apache-2.0
    URL: https://github.com/secondmind-labs/GPflux/blob/develop/LICENSE
Repository:
  - Name: secondmind-labs/GPflux
    URL: https://github.com/secondmind-labs/GPflux
Version:
  - Name: v0.4.5
    URL: https://github.com/secondmind-labs/GPflux/releases/tag/v0.4.5
Installation:
  - PyPI
Developer:
  - Tag: yellow
    Name: University of Cambridge
    URL: https://www.cam.ac.uk
  - Tag: purple
    Name: Imperial College London
    URL: https://www.imperial.ac.uk
  - Tag: purple
    Name: University College London
    URL: https://www.ucl.ac.uk
  - Tag: purple
    Name: Secondimind labs
    URL: https://www.secondmind.ai
  - Tag: default
    Name: GPflux contributors
    URL: https://github.com/secondmind-labs/GPflux/graphs/contributors
Docs:
  - Name: docs
    URL: https://secondmind-labs.github.io/GPflux/#getting-started
  - Name: tutorials
    URL: https://secondmind-labs.github.io/GPflux/tutorials.html
  - Name: API
    URL: https://secondmind-labs.github.io/GPflux/autoapi/gpflux/index.html
Support:
  - Name: slack
    URL: https://secondmind-labs.slack.com/join/shared_invite/zt-ph07nuie-gMlkle__tjvXBay4FNSLkw#/shared-invite/email
Framework:
  - TensorFlow
GPU: false
Models:
  - Types:
      - Tag: yellow
        Name: Deep Gaussian Processes (DGP)
      - Tag: green
        Name: Sparse Variational Gaussian Process (SVGP)
    URL: https://secondmind-labs.github.io/GPflux/notebooks/intro.html
Complexity:
  - O(M^3)
Trend:
  - Types:
      - Tag: default
        Name: Identity
      - Tag: green
        Name: Linear
      - Tag: blue
        Name: Zero
    URL: https://secondmind-labs.github.io/GPflux/autoapi/gpflux/helpers/index.html
LengthScale:
  - Anisotropic
Correlation:
  - Types:
      - Tag: blue
        Name: Squared Exponential
      - Tag: yellow
        Name: Matern12
      - Tag: green
        Name: Linear
      - Tag: green
        Name: Periodic
      - Tag: default
        Name: Separate Independent
      - Tag: default
        Name: Custom
    URL: https://secondmind-labs.github.io/GPflux/autoapi/gpflux/helpers/index.html
Mixture: true
MixtureModels:
  - Types:
      - Tag: red
        Name: Sum
    URL: https://secondmind-labs.github.io/GPflux/autoapi/gpflux/helpers/index.html
Likelihood:
  - Types:
      - Tag: blue
        Name: Gaussian
      - Tag: orange
        Name: Bernoulli
      - Tag: default
        Name: Softmax
      - Tag: default
        Name: RobustMax
      - Tag: default
        Name: Custom
    URL: https://secondmind-labs.github.io/GPflux/notebooks/intro.html
    Nugget:
      - Tag: null
        Name: null
    Noise:
      - Tag: yellow
        Name: Inferable
EstimationMethods:
  - Types:
      - Tag: red
        Name: Evidence Lower Bound (ELBO)
      - Tag: teal
        Name: Variational Inference (VI)
    URL: https://secondmind-labs.github.io/GPflux/autoapi/gpflux/layers/gp_layer/index.html
OptimizationMethods:
  - Types:
      - Tag: orange
        Name: Adam
      - Tag: orange
        Name: Keras optimizer
      - Tag: default
        Name: Natural Gradient Descent (NGD)
    URL: https://secondmind-labs.github.io/GPflux/autoapi/gpflux/optimization/keras_natgrad/index.html
Resampling: false
Metrics:
  - null
