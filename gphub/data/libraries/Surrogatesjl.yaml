PackageID: Surrogatesjl
Library:
  - Name: Surrogates.jl
    URL: https://docs.sciml.ai/Surrogates/stable/
    Reference:
      - Author: Rackauckas et al. (2024)
        URL: https://doi.org/10.5281/zenodo.12571718
Language:
  - Julia
License:
  - Name: MIT
    URL: https://github.com/SciML/Surrogates.jl/blob/master/LICENSE.md
Repository:
  - Name: SciML/Surrogates.jl
    URL: https://github.com/SciML/Surrogates.jl
Version:
  - Name: v8.0.0
    URL: https://github.com/SciML/Surrogates.jl/releases/tag/v8.0.0
Installation:
  - Pkg.jl
Developer:
  - Tag: red
    Name: Chan Zuckerberg Initiative
    URL: https://chanzuckerberg.com
  - Tag: default
    Name: Wellcome Trust
    URL: https://wellcome.org
  - Tag: orange
    Name: Microsoft
    URL: https://www.microsoft.com/en-us/research/collaboration/studies-in-pandemic-preparedness/overview/
  - Tag: default
    Name: Surrogates.jl contributors
    URL: https://github.com/SciML/Surrogates.jl/graphs/contributors
Docs:
  - Name: docs
    URL: https://docs.sciml.ai/Surrogates/stable/kriging/
Support:
  - Name: chat
    URL: https://julialang.zulipchat.com/#narrow/stream/279055-sciml-bridged
Framework:
  - null
GPU: false
Models:
  - Types:
      - Tag: blue
        Name: Gaussian Process Regression (GPR)
      - Tag: uiBlue
        Name: Gradient-enhanced Kriging (GEK)
      - Tag: teal
        Name: Kriging with Partial Least Squares (KPLS / KPLSK)
      - Tag: default
        Name: Gradient-enhanced KPLS (GEKPLS)
    URL: https://github.com/SciML/Surrogates.jl#surrogate-models
Complexity:
  - O(N^3)
Trend:
  - Types:
      - Tag: orange
        Name: Constant
    URL: https://docs.sciml.ai/Surrogates/stable/surrogate/
LengthScale:
  - Isotropic
  - Anisotropic
Correlation:
  - Types:
      - Tag: teal
        Name: Power Exponential
      - Tag: blue
        Name: Gaussian
      - Tag: yellow
        Name: Matern52
      - Tag: teal
        Name: Polynomial
    URL: https://docs.sciml.ai/Surrogates/stable/surrogate/
Mixture: true
MixtureModels:
  - Types:
      - Tag: red
        Name: Sum
      - Tag: green
        Name: Product
      - Tag: teal
        Name: Scale
      - Tag: default
        Name: Tensor Product
    URL: https://juliagaussianprocesses.github.io/KernelFunctions.jl/stable/kernels/
Likelihood:
  - Types:
      - Tag: blue
        Name: Gaussian
    URL: https://docs.sciml.ai/Surrogates/stable/abstractgps/
    Nugget:
      - Tag: default
        Name: Custom
      - Tag: blue
        Name: "default value: 10*eps()"
    Noise:
      - Tag: default
        Name: Custom
EstimationMethods:
  - Types:
      - Tag: blue
        Name: Maximum Likelihood Estimation (MLE)
    URL: https://docs.sciml.ai/Surrogates/stable/kriging/
OptimizationMethods:
  - Types:
      - Tag: default
        Name: Nelder-Mead
    URL: https://docs.sciml.ai/Surrogates/stable/kriging/
Resampling: false
Metrics:
  - null
