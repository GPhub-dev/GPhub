PackageID: george
Library:
  - Name: george
    URL: https://george.readthedocs.io/en/latest/
    Reference:
      - Author: Ambikasaran et al. (2015)
        URL: https://ieeexplore.ieee.org/document/7130620
Language:
  - Python
License:
  - Name: MIT
    URL: https://github.com/dfm/george/blob/main/LICENSE
Repository:
  - Name: dfm/george
    URL: https://github.com/dfm/george
Version:
  - Name: v0.4.4
    URL: https://github.com/dfm/george/releases/tag/v0.4.4
Installation:
  - PyPI
  - conda
Developer:
  - Tag: purple
    Name: New York University
    URL: https://www.nyu.edu
  - Tag: blue
    Name: Simons Foundation
    URL: https://www.simonsfoundation.org/
  - Tag: default
    Name: george contributors
    URL: https://github.com/dfm/george/graphs/contributors
Docs:
  - Name: docs
    URL: https://george.readthedocs.io/en/latest/user/
  - Name: tutorials
    URL: https://george.readthedocs.io/en/latest/tutorials/
Support:
  - Name: null
    URL: null
Framework:
  - NumPy
  - SciPy
GPU: false
Models:
  - Types:
      - Tag: blue
        Name: Gaussian Process Regression (GPR)
    URL: https://george.readthedocs.io/en/latest/
Complexity:
  - O(N^3)
  - O(N log^2 N)
Trend:
  - Types:
      - Tag: blue
        Name: Zero
      - Tag: orange
        Name: Constant
      - Tag: default
        Name: Custom
    URL: https://george.readthedocs.io/en/latest/user/gp/
LengthScale:
  - Isotropic
  - Anisotropic
Correlation:
  - Types:
      - Tag: orange
        Name: Constant
      - Tag: default
        Name: Dot Product
      - Tag: teal
        Name: Exponential
      - Tag: blue
        Name: Squared Exponential
      - Tag: yellow
        Name: Matern32
      - Tag: yellow
        Name: Matern52
      - Tag: red
        Name: Rational Quadratic
      - Tag: teal
        Name: Exponential Sine Squared
      - Tag: green
        Name: Cosine
      - Tag: default
        Name: Local Gaussian
      - Tag: teal
        Name: Polynomial
      - Tag: green
        Name: Linear
      - Tag: default
        Name: Custom
    URL: https://george.readthedocs.io/en/latest/user/kernels/
Mixture: true
MixtureModels:
  - Types:
      - Tag: red
        Name: Sum
      - Tag: green
        Name: Product
    URL: https://george.readthedocs.io/en/latest/user/kernels/
Likelihood:
  - Types:
      - Tag: blue
        Name: Gaussian
    URL: https://george.readthedocs.io/en/latest/user/gp/
    Nugget:
      - Tag: default
        Name: Custom
      - Tag: yellow
        Name: Inferable
      - Tag: blue
        Name: "default value: log(TINY)"
    Noise:
      - Tag: yellow
        Name: Inferable
      - Tag: default
        Name: Custom
EstimationMethods:
  - Types:
      - Tag: blue
        Name: Maximum Likelihood Estimation (MLE)
      - Tag: default
        Name: Markov Chain Monte Carlo (MCMC)
    URL: https://george.readthedocs.io/en/latest/tutorials/hyper/
OptimizationMethods:
  - Types:
      - Tag: yellow
        Name: L-BFGS-B
      - Tag: blue
        Name: SciPy optimizer
    URL: https://george.readthedocs.io/en/latest/tutorials/hyper/
Resampling: false
Metrics:
  - null
