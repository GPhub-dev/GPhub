PackageID: MUQ
Library:
  - Name: MUQ
    URL: https://mituq.bitbucket.io/source/_site/
    Reference:
      - Author: Parno et al. (2021)
        URL: https://doi.org/10.21105/joss.03076
Language:
  - C++
  - Python
License:
  - Name: BSD-3-Clause
    URL: https://bitbucket.org/mituq/muq2/src/master/LICENSE
Repository:
  - Name: mituq/muq2
    URL: https://bitbucket.org/mituq/muq2
Version:
  - Name: v0.5.0
    URL: https://github.com/NexGenAnalytics/MIT-MUQ/releases/tag/v0.5.0
Installation:
  - conda
Developer:
  - Tag: red
    Name: Massachusetts Institute of Technology
    URL: https://www.mit.edu
  - Tag: green
    Name: Dartmouth College
    URL: https://math.dartmouth.edu
  - Tag: purple
    Name: New York University
    URL: https://www.nyu.edu
  - Tag: red
    Name: Heidelberg University
    URL: https://www.uni-heidelberg.de
  - Tag: blue
    Name: National Science Foundation
    URL: https://www.nsf.gov
  - Tag: green
    Name: US Department of Energy
    URL: https://www.energy.gov
Docs:
  - Name: docs
    URL: https://mituq.bitbucket.io/source/_site/latest/index.html
  - Name: examples
    URL: https://mituq.bitbucket.io/source/_site/examples.html
  - Name: py examples
    URL: https://bitbucket.org/mituq/muq2-examples/src/master/
Support:
  - Name: slack
    URL: https://mituq.bitbucket.io/source/_site/index.html
Framework:
  - null
GPU: false
Models:
  - Types:
      - Tag: blue
        Name: Gaussian Process Regression (GPR)
      - Tag: default
        Name: Markov (State Space) Gaussian Process
    URL: https://mituq.bitbucket.io/source/_site/latest/group__GaussianProcesses.html
Complexity:
  - null
Trend:
  - Types:
      - Tag: blue
        Name: Zero
      - Tag: orange
        Name: Constant
      - Tag: green
        Name: Linear
      - Tag: default
        Name: Linear Transform
      - Tag: red
        Name: Sum
    URL: https://mituq.bitbucket.io/source/_site/latest/group__MeanFunctions.html
LengthScale:
  - Isotropic
  - Anisotropic
Correlation:
  - Types:
      - Tag: blue
        Name: Squared Exponential
      - Tag: yellow
        Name: Matern
      - Tag: green
        Name: Periodic
      - Tag: green
        Name: Linear
      - Tag: orange
        Name: Constant
      - Tag: default
        Name: White noise
      - Tag: default
        Name: Linear Transform
    URL: https://mituq.bitbucket.io/source/_site/latest/group__CovarianceKernels.html
Mixture: true
MixtureModels:
  - Types:
      - Tag: red
        Name: Sum
      - Tag: green
        Name: Product
      - Tag: default
        Name: Concatenate
    URL: https://mituq.bitbucket.io/source/_site/latest/group__CovarianceKernels.html
Likelihood:
  - Types:
      - Tag: blue
        Name: Gaussian
    URL: https://mituq.bitbucket.io/source/_site/latest/classmuq_1_1Approximation_1_1GaussianProcess.html
    Nugget:
      - Tag: blue
        Name: "default value: 1e-14"
    Noise:
      - Tag: default
        Name: Custom
EstimationMethods:
  - Types:
      - Tag: null
        Name: null
    URL: null
OptimizationMethods:
  - Types:
      - Tag: null
        Name: null
    URL: null
Resampling: false
Metrics:
  - null
