PackageID: friedrich
Library:
  - Name: friedrich
    URL: https://github.com/nestordemeure/friedrich?tab=readme-ov-file
    Reference:
      - Author: Demeure (2019)
        URL: https://github.com/nestordemeure/friedrich
Language:
  - Rust
License:
  - Name: Apache-2.0
    URL: https://github.com/nestordemeure/friedrich/blob/master/LICENSE
Repository:
  - Name: nestordemeure/friedrich
    URL: https://github.com/nestordemeure/friedrich
Version:
  - Name: 0.6.0
    URL: https://crates.io/crates/friedrich/0.6.0
Installation:
  - cargo
Developer:
  - Tag: default
    Name: friedrich contributors
    URL: https://github.com/nestordemeure/friedrich/graphs/contributors
Docs:
  - Name: docs
    URL: https://docs.rs/friedrich
Support:
  - Name: null
    URL: null
Framework:
  - null
GPU: false
Models:
  - Types:
      - Tag: blue
        Name: Gaussian Process Regression (GPR)
    URL: https://docs.rs/friedrich/latest/friedrich/
Complexity:
  - O(N^3)
Trend:
  - Types:
      - Tag: blue
        Name: Zero
      - Tag: orange
        Name: Constant
      - Tag: green
        Name: Linear
      - Tag: default
        Name: Custom
    URL: https://docs.rs/friedrich/latest/friedrich/prior/index.html
LengthScale:
  - Isotropic
Correlation:
  - Types:
      - Tag: blue
        Name: Squared Exponential
      - Tag: teal
        Name: Exponential
      - Tag: yellow
        Name: Matern32
      - Tag: yellow
        Name: Matern52
      - Tag: red
        Name: Rational Quadratic
      - Tag: green
        Name: Linear
      - Tag: teal
        Name: Polynomial
      - Tag: default
        Name: Multiquadric
      - Tag: default
        Name: Hyperbolic Tangent
      - Tag: default
        Name: Custom
    URL: https://docs.rs/friedrich/latest/friedrich/kernel/index.html
Mixture: true
MixtureModels:
  - Types:
      - Tag: red
        Name: Sum
      - Tag: green
        Name: Product
    URL: https://docs.rs/friedrich/latest/friedrich/kernel/index.html
Likelihood:
  - Types:
      - Tag: blue
        Name: Gaussian
    URL: https://docs.rs/friedrich/latest/friedrich/gaussian_process/struct.GaussianProcess.html
    Nugget:
      - Tag: default
        Name: Custom
    Noise:
      - Tag: default
        Name: Custom
      - Tag: yellow
        Name: Inferable
EstimationMethods:
  - Types:
      - Tag: blue
        Name: Maximum Likelihood Estimation (MLE)
    URL: https://github.com/nestordemeure/friedrich/blob/master/src/gaussian_process/optimizer.rs
OptimizationMethods:
  - Types:
      - Tag: orange
        Name: Adam
      - Tag: default
        Name: Gradient Descent
    URL: https://github.com/nestordemeure/friedrich/blob/master/src/gaussian_process/optimizer.rs
Resampling: false
Metrics:
  - null
