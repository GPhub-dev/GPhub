PackageID: GSTools
Library:
  - Name: GSTools
    URL: https://geostat-framework.org
    Reference:
      - Author: "Müller et al. (2022)"
        URL: https://gmd.copernicus.org/articles/15/3161/2022/
Language:
  - Python
License:
  - Name: LGPL
    URL: https://github.com/GeoStat-Framework/GSTools/blob/main/LICENSE
Repository:
  - Name: GeoStat-Framework/GSTools
    URL: https://github.com/GeoStat-Framework/GSTools
Version:
  - Name: v1.7.0
    URL: https://github.com/GeoStat-Framework/GSTools/releases/tag/v1.7.0
Installation:
  - PyPI
  - conda
Developer:
  - Tag: blue
    Name: UFZ
    URL: https://www.ufz.de
  - Tag: teal
    Name: University of Potsdam
    URL: https://www.uni-potsdam.de/en/
  - Tag: blue
    Name: CASUS
    URL: https://www.casus.science
  - Tag: yellow
    Name: " Utrecht University"
    URL: https://www.uu.nl/en
  - Tag: default
    Name: GSTools contributors
    URL: https://github.com/GeoStat-Framework/GSTools/graphs/contributors
Docs:
  - Name: docs
    URL: https://geostat-framework.readthedocs.io/projects/gstools/en/stable/
  - Name: tutorials
    URL: https://geostat-framework.readthedocs.io/projects/gstools/en/stable/tutorials.html
  - Name: API
    URL: https://geostat-framework.readthedocs.io/projects/gstools/en/stable/api.html
Support:
  - Name: GitHub discussions
    URL: https://github.com/GeoStat-Framework/GSTools/discussions
Framework:
  - NumPy
  - SciPy
GPU: false
Models:
  - Types:
      - Tag: blue
        Name: Gaussian Process Regression (GPR)
      - Tag: default
        Name: Simple Kriging (SK)
      - Tag: default
        Name: Ordinary Kriging (OK)
      - Tag: default
        Name: Universal Kriging (UK)
      - Tag: default
        Name: External Drift Kriging
      - Tag: default
        Name: Detrended Kriging
    URL: https://geostat-framework.readthedocs.io/projects/gstools/en/stable/api/gstools.krige.html
Complexity:
  - null
Trend:
  - Types:
      - Tag: orange
        Name: Constant
      - Tag: green
        Name: Linear
      - Tag: red
        Name: Quadratic
      - Tag: teal
        Name: Polynomial
      - Tag: default
        Name: External Drift
      - Tag: default
        Name: Custom
    URL: https://geostat-framework.readthedocs.io/projects/gstools/en/stable/api/gstools.krige.Krige.html
LengthScale:
  - Isotropic
  - Anisotropic
Correlation:
  - Types:
      - Tag: blue
        Name: Gaussian
      - Tag: teal
        Name: Exponential
      - Tag: yellow
        Name: Matern
      - Tag: default
        Name: Exponential Integral
      - Tag: default
        Name: Stable
      - Tag: red
        Name: Rational Quadratic
      - Tag: default
        Name: Cubic
      - Tag: green
        Name: Linear
      - Tag: default
        Name: Circular
      - Tag: default
        Name: Spherical
      - Tag: default
        Name: HyperSpherical
      - Tag: default
        Name: SuperSpherical
      - Tag: default
        Name: J-Bessel
      - Tag: default
        Name: Truncated Power Law (TPLGaussian, TPLExponential, TPLStable, TPLSimple)
      - Tag: default
        Name: White noise
      - Tag: default
        Name: Custom
    URL: https://geostat-framework.readthedocs.io/projects/gstools/en/stable/api/gstools.covmodel.html
Mixture: true
MixtureModels:
  - Types:
      - Tag: red
        Name: Sum
    URL: https://geostat-framework.readthedocs.io/projects/gstools/en/stable/api/gstools.covmodel.SumModel.html
Likelihood:
  - Types:
      - Tag: blue
        Name: Gaussian
    URL: https://geostat-framework.readthedocs.io/projects/gstools/en/stable/api/gstools.krige.Krige.html
    Nugget:
      - Tag: default
        Name: Custom
      - Tag: yellow
        Name: Inferable
    Noise:
      - Tag: default
        Name: Custom
EstimationMethods:
  - Types:
      - Tag: default
        Name: Variogram fitting (non-linear least squares)
      - Tag: default
        Name: Weighted Least Squares (WLS)
    URL: https://geostat-framework.readthedocs.io/projects/gstools/en/stable/api/gstools.covmodel.CovModel.html
OptimizationMethods:
  - Types:
      - Tag: blue
        Name: SciPy optimizer
      - Tag: default
        Name: Trust Region Reflective (trf)
      - Tag: default
        Name: Dogleg (dogbox)
    URL: https://geostat-framework.readthedocs.io/projects/gstools/en/stable/api/gstools.covmodel.CovModel.html
Resampling: false
Metrics:
  - R2
