PackageID: STAN
Library:
  - Name: STAN
    URL: https://mc-stan.org
    Reference:
      - Author: Stan Development Team (2017)
        URL: https://zenodo.org/records/1101116
Language:
  - R
  - C++
  - Julia
  - Python
  - Matlab
License:
  - Name: BSD-3-Clause
    URL: https://github.com/brian-lau/MatlabStan/blob/master/LICENSE.txt
Repository:
  - Name: brian-lau/MatlabStan
    URL: https://github.com/brian-lau/MatlabStan
Version:
  - Name: v2.15.1.0
    URL: https://github.com/brian-lau/MatlabStan/releases/tag/v2.15.1.0
Installation:
  - CRAN
  - PyPI
  - Pkg.jl
  - conda
Developer:
  - Tag: default
    Name: Stan Development Team
    URL: https://github.com/orgs/stan-dev/people
  - Tag: orange
    Name: NumFOCUS
    URL: https://numfocus.org
  - Tag: default
    Name: Stan contributors
    URL: https://github.com/stan-dev/stan/graphs/contributors
  - Tag: default
    Name: MatlabStan contributors
    URL: https://github.com/brian-lau/MatlabStan/graphs/contributors
  - Tag: default
    Name: RStan contributors
    URL: https://github.com/stan-dev/rstan/graphs/contributors
  - Tag: default
    Name: pyStan contributors
    URL: https://github.com/stan-dev/pystan/graphs/contributors
  - Tag: default
    Name: Stan.jl contributors
    URL: https://github.com/StanJulia/Stan.jl/graphs/contributors
Docs:
  - Name: docs
    URL: https://mc-stan.org/docs/stan-users-guide/gaussian-processes.html
  - Name: r docs
    URL: https://cran.r-project.org/web/packages/rstan/rstan.pdf
  - Name: mat docs
    URL: https://github.com/brian-lau/MatlabStan/wiki
  - Name: py docs
    URL: https://pystan.readthedocs.io/en/latest/
  - Name: jl docs
    URL: https://github.com/StanJulia/Stan.jl/tree/master/docs
Support:
  - Name: forum
    URL: https://discourse.mc-stan.org
  - Name: slack
    URL: https://mc-stan.slack.com/join/shared_invite/zt-1le4ebi4m-UMtiOkJb4gcS16qz2wIYCw#/shared-invite/email
Framework:
  - null
GPU: true
Models:
  - Types:
      - Tag: blue
        Name: Gaussian Process Regression (GPR)
      - Tag: orange
        Name: Gaussian Process Classification (GPC)
      - Tag: red
        Name: Multi-output Gaussian Process (MOGP)
    URL: https://mc-stan.org/docs/stan-users-guide/gaussian-processes.html
Complexity:
  - O(N^3)
Trend:
  - Types:
      - Tag: blue
        Name: Zero
      - Tag: default
        Name: Custom
    URL: https://mc-stan.org/docs/stan-users-guide/gaussian-processes.html
LengthScale:
  - Isotropic
  - Anisotropic
Correlation:
  - Types:
      - Tag: blue
        Name: Squared Exponential
      - Tag: default
        Name: Dot Product
      - Tag: teal
        Name: Exponential
      - Tag: yellow
        Name: Matern32
      - Tag: yellow
        Name: Matern52
      - Tag: green
        Name: Periodic
      - Tag: default
        Name: Custom
    URL: https://mc-stan.org/docs/functions-reference/matrix_operations.html#gaussian-process-covariance-functions
Mixture: false
MixtureModels:
  - Types:
      - Tag: null
        Name: null
    URL: null
Likelihood:
  - Types:
      - Tag: blue
        Name: Gaussian
      - Tag: green
        Name: Poisson
      - Tag: orange
        Name: Bernoulli
      - Tag: default
        Name: Custom
    URL: https://mc-stan.org/docs/stan-users-guide/gaussian-processes.html
    Nugget:
      - Tag: default
        Name: Custom
    Noise:
      - Tag: yellow
        Name: Inferable
EstimationMethods:
  - Types:
      - Tag: default
        Name: Markov Chain Monte Carlo (MCMC)
      - Tag: default
        Name: Hamiltonian Monte Carlo (HMC)
      - Tag: default
        Name: No-U-Turn Sampler (NUTS)
      - Tag: default
        Name: Maximum A Posteriori (MAP)
      - Tag: default
        Name: Automatic Differentiation Variational Inference (ADVI)
      - Tag: default
        Name: Pathfinder
      - Tag: purple
        Name: Laplace Approximation (LA)
    URL: https://mc-stan.org/docs/cmdstan-guide/command_line_options.html
OptimizationMethods:
  - Types:
      - Tag: yellow
        Name: L-BFGS
      - Tag: yellow
        Name: BFGS
      - Tag: default
        Name: Newton
    URL: https://mc-stan.org/docs/reference-manual/optimization.html
Resampling: false
Metrics:
  - null
