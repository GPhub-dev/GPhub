PackageID: PYRO
Library:
  - Name: PYRO
    URL: https://pyro.ai
    Reference:
      - Author: Bingham et al. (2019)
        URL: http://jmlr.org/papers/v20/18-403.html
Language:
  - Python
License:
  - Name: Apache-2.0
    URL: https://github.com/pyro-ppl/pyro/blob/dev/LICENSE.md
Repository:
  - Name: pyro-ppl/pyro
    URL: https://github.com/pyro-ppl/pyro
Version:
  - Name: 1.9.1
    URL: https://github.com/pyro-ppl/pyro/releases/tag/1.9.1
Installation:
  - PyPI
  - conda
Developer:
  - Tag: default
    Name: Uber AI
    URL: https://www.uber.com/blog/engineering/
  - Tag: red
    Name: Stanford University
    URL: https://www.stanford.edu
  - Tag: blue
    Name: Broad Institute
    URL: https://www.broadinstitute.org
  - Tag: default
    Name: Linux Foundation
    URL: https://www.linuxfoundation.org
  - Tag: default
    Name: PYRO contributors
    URL: https://github.com/pyro-ppl/pyro/graphs/contributors
Docs:
  - Name: docs
    URL: https://pyro.ai/examples/gp.html
  - Name: examples
    URL: https://pyro.ai/examples/
Support:
  - Name: forum
    URL: http://forum.pyro.ai/
Framework:
  - PyTorch
GPU: true
Models:
  - Types:
      - Tag: blue
        Name: Gaussian Process Regression (GPR)
      - Tag: green
        Name: Sparse Gaussian Process Regression (SGPR)
      - Tag: teal
        Name: Variational Gaussian Process (VGP)
      - Tag: green
        Name: Sparse Variational Gaussian Process (SVGP)
      - Tag: orange
        Name: Gaussian Process Classification (GPC)
      - Tag: orange
        Name: Gaussian Process Latent Variable Model (GPLVM)
      - Tag: red
        Name: Multi-output Gaussian Process (MOGP)
    URL: https://docs.pyro.ai/en/stable/contrib.gp.html
Complexity:
  - O(N^3)
  - O(NM^2)
  - O(M^3)
Trend:
  - Types:
      - Tag: blue
        Name: Zero
      - Tag: default
        Name: Custom
    URL: https://docs.pyro.ai/en/stable/contrib.gp.html
LengthScale:
  - Isotropic
  - Anisotropic
Correlation:
  - Types:
      - Tag: blue
        Name: Squared Exponential
      - Tag: yellow
        Name: Matern32
      - Tag: yellow
        Name: Matern52
      - Tag: teal
        Name: Exponential
      - Tag: red
        Name: Rational Quadratic
      - Tag: green
        Name: Periodic
      - Tag: green
        Name: Cosine
      - Tag: green
        Name: Linear
      - Tag: teal
        Name: Polynomial
      - Tag: orange
        Name: Constant
      - Tag: default
        Name: White noise
      - Tag: default
        Name: Brownian
      - Tag: default
        Name: Coregionalize
      - Tag: default
        Name: Custom
    URL: https://docs.pyro.ai/en/stable/contrib.gp.html
Mixture: true
MixtureModels:
  - Types:
      - Tag: red
        Name: Sum
      - Tag: green
        Name: Product
      - Tag: default
        Name: Exponent
      - Tag: default
        Name: Vertical Scaling
      - Tag: default
        Name: Warping
    URL: https://docs.pyro.ai/en/stable/contrib.gp.html
Likelihood:
  - Types:
      - Tag: blue
        Name: Gaussian
      - Tag: orange
        Name: Bernoulli
      - Tag: default
        Name: Softmax
      - Tag: green
        Name: Poisson
      - Tag: default
        Name: Custom
    URL: https://docs.pyro.ai/en/stable/contrib.gp.html
    Nugget:
      - Tag: default
        Name: Custom
      - Tag: blue
        Name: "default value: 1e-6"
    Noise:
      - Tag: yellow
        Name: Inferable
EstimationMethods:
  - Types:
      - Tag: blue
        Name: Maximum Likelihood Estimation (MLE)
      - Tag: default
        Name: Maximum A Posteriori (MAP)
      - Tag: red
        Name: Evidence Lower Bound (ELBO)
      - Tag: teal
        Name: Variational Inference (VI)
      - Tag: teal
        Name: Stochastic Variational Inference (SVI)
      - Tag: default
        Name: Markov Chain Monte Carlo (MCMC)
      - Tag: default
        Name: Hamiltonian Monte Carlo (HMC)
      - Tag: teal
        Name: Variational Free Energy (VFE)
      - Tag: uiBlue
        Name: Fully Independent Training Conditional (FITC)
      - Tag: uiBlue
        Name: Deterministic Training Conditional (DTC)
    URL: https://docs.pyro.ai/en/stable/contrib.gp.html
OptimizationMethods:
  - Types:
      - Tag: orange
        Name: Adam
      - Tag: purple
        Name: PyTorch optimizer
    URL: https://docs.pyro.ai/en/stable/contrib.gp.html
Resampling: false
Metrics:
  - null
