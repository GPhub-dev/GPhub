PackageID: libgp
Library:
  - Name: libgp
    URL: https://github.com/mblum/libgp
    Reference:
      - Author: Blum & Riedmiller (2013)
        URL: https://www.esann.org/sites/default/files/proceedings/legacy/es2013-51.pdf
Language:
  - C++
License:
  - Name: BSD-3-Clause
    URL: https://github.com/mblum/libgp/blob/master/COPYING
Repository:
  - Name: mblum/libgp
    URL: https://github.com/mblum/libgp
Version:
  - Name: v0.3.0
    URL: https://github.com/mblum/libgp/releases/tag/v0.3.0
Installation:
  - null
Developer:
  - Tag: default
    Name: Manuel Blum
    URL: https://github.com/mblum
Docs:
  - Name: docs
    URL: https://github.com/mblum/libgp#readme
Support:
  - Name: null
    URL: null
Framework:
  - null
GPU: false
Models:
  - Types:
      - Tag: blue
        Name: Gaussian Process Regression (GPR)
    URL: https://github.com/mblum/libgp/blob/master/README.md
Complexity:
  - null
Trend:
  - Types:
      - Tag: blue
        Name: Zero
    URL: https://github.com/mblum/libgp/blob/master/README.md
LengthScale:
  - Isotropic
  - Anisotropic
Correlation:
  - Types:
      - Tag: blue
        Name: Squared Exponential
      - Tag: yellow
        Name: Matern32
      - Tag: yellow
        Name: Matern52
      - Tag: red
        Name: Rational Quadratic
      - Tag: green
        Name: Linear
      - Tag: green
        Name: Periodic
      - Tag: default
        Name: White noise
      - Tag: default
        Name: Custom
    URL: https://github.com/mblum/libgp/blob/master/README.md
Mixture: true
MixtureModels:
  - Types:
      - Tag: red
        Name: Sum
      - Tag: green
        Name: Product
    URL: https://github.com/mblum/libgp/blob/master/README.md
Likelihood:
  - Types:
      - Tag: blue
        Name: Gaussian
    URL: https://github.com/mblum/libgp/blob/master/README.md
    Nugget:
      - Tag: default
        Name: Custom
    Noise:
      - Tag: yellow
        Name: Inferable
      - Tag: default
        Name: Custom
EstimationMethods:
  - Types:
      - Tag: blue
        Name: Maximum Likelihood Estimation (MLE)
    URL: https://github.com/mblum/libgp/blob/master/README.md
OptimizationMethods:
  - Types:
      - Tag: orange
        Name: Conjugate Gradient (CG)
      - Tag: default
        Name: Rprop
    URL: https://github.com/mblum/libgp/blob/master/README.md
Resampling: false
Metrics:
  - null
